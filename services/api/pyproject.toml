[project]
name = "agentdeck-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1", "fastapi>=0.115", "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6", "PyJWT>=2.10", "redis>=5.2",
  "sqlalchemy>=2.0", "uvicorn[standard]>=0.32", "httpx>=0.28", "email-validator>=2.2", "cryptography>=44.0"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = ["httpx>=0.28", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"] # FastAPI's dependency injection requires this signature form.

[tool.mypy]
strict = true
plugins = []
