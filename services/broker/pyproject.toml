[project]
name = "agentdeck-broker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["docker==7.1.0", "fastapi==0.115.6", "pydantic==2.10.3", "uvicorn[standard]==0.32.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
